name: Apply V3 homepage effects

on:
  push:
    paths:
      - '.github/workflows/apply-approved-v2.yml'

permissions:
  contents: write

jobs:
  apply-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Link V3 stylesheet and effects
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('approved-v2.css?v=20260721-v2', 'approved-v2.css?v=20260721-v4')
          text = text.replace('approved-v2.css?v=20260721-v3', 'approved-v2.css?v=20260721-v4')

          script = '<script src="v3-effects.js?v=20260721-v1"></script>'
          if script not in text:
              if '</body>' not in text:
                  raise SystemExit('Closing body tag not found.')
              text = text.replace('</body>', script + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage update
        run: |
          if git diff --quiet -- index.html; then
            echo "V3 effects already linked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable V3 homepage effects"
          git push
