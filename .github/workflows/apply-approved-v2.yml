name: Apply approved V3 homepage style

on:
  push:
    paths:
      - '.github/workflows/apply-approved-v2.yml'

permissions:
  contents: write

jobs:
  apply-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh homepage stylesheet version
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<link rel="stylesheet" href="approved-v2.css?v=20260721-v2">'
          new = '<link rel="stylesheet" href="approved-v2.css?v=20260721-v3">'

          if new in text:
              print('V3 stylesheet version is already active.')
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          else:
              raise SystemExit('Expected V2 stylesheet reference not found; index.html was not changed.')
          PY

      - name: Commit homepage update
        run: |
          if git diff --quiet -- index.html; then
            echo "V3 stylesheet version already active."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate V3 homepage stylesheet"
          git push
