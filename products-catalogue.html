<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMP PARTS - Full Product Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1B3A5E;
  --blue: #2E6DA4;
  --blue-light: #5DADE2;
  --gold: #E05A00;
  --gold-light: #F07020;
  --red: #C0392B;
  --white: #FFFFFF;
  --gray: #8899AA;
  --dark: #0D2340;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  font-family:'Barlow',sans-serif; 
  background:var(--dark); 
  color:var(--white); 
  padding-top: 80px;
}
.cata-header {
  position:fixed;
  top:0;
  left:0;
  right:0;
  background:rgba(6,14,26,0.96);
  backdrop-filter:blur(16px);
  padding:16px 48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:100;
  border-bottom:1px solid rgba(232,160,32,0.2);
}
.cata-logo {
  font-family:'Barlow Condensed',sans-serif;
  font-weight:900;
  font-size:24px;
  letter-spacing:2px;
  color:var(--white);
  text-decoration:none;
}
.cata-logo span { color:var(--gold); }
.back-home {
  background:var(--gold);
  color:var(--navy);
  padding:8px 20px;
  font-weight:700;
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  text-decoration:none;
  border-radius:2px;
  transition:all .2s;
}
.back-home:hover { background:var(--gold-light); transform:translateY(-2px); }

.cata-title {
  text-align:center;
  margin: 20px 0 32px;
}
.cata-title h1 {
  font-family:'Barlow Condensed',sans-serif;
  font-size:48px;
  font-weight:900;
  text-transform:uppercase;
  color:var(--gold);
}
.cata-title p {
  font-size:14px;
  color:var(--gray);
}

/* 分类筛选栏 */
.cata-filter {
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:40px;
  padding:0 20px;
}
.filter-btn {
  background:transparent;
  border:1px solid rgba(255,255,255,0.2);
  color:rgba(255,255,255,0.6);
  padding:8px 20px;
  font-size:13px;
  font-weight:600;
  letter-spacing:1px;
  cursor:pointer;
  transition:all .2s;
  border-radius:30px;
}
.filter-btn:hover, .filter-btn.active {
  background:var(--gold);
  border-color:var(--gold);
  color:var(--navy);
}

.cata-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
  padding:0 48px 60px;
  max-width:1400px;
  margin:0 auto;
}
.cata-item {
  background:#0a1520;
  border-radius:12px;
  overflow:hidden;
  transition:transform 0.3s ease, box-shadow 0.3s ease;
}
.cata-item:hover {
  transform:translateY(-8px);
  box-shadow:0 20px 40px rgba(0,0,0,0.4);
}
.cata-img {
  width:100%;
  aspect-ratio:4/3;
  object-fit:contain;
  background:#0a1520;
  padding:24px;
  transition:transform 0.3s ease;
}
.cata-item:hover .cata-img {
  transform:scale(1.05);
}
.cata-info {
  padding:20px;
  border-top:1px solid rgba(255,255,255,0.05);
}
.cata-cat {
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:6px;
}
.cata-name {
  font-family:'Barlow Condensed',sans-serif;
  font-size:20px;
  font-weight:800;
  text-transform:uppercase;
  margin-bottom:8px;
  color:#fff;
}
.cata-brands {
  font-size:11px;
  color:rgba(255,255,255,0.6);
  line-height:1.5;
}
.cata-partno {
  font-size:10px;
  color:var(--gray);
  margin-top:8px;
  font-family:monospace;
}
.loading {
  text-align:center;
  padding:80px;
  color:var(--gray);
  font-size:18px;
}
.back-top {
  position:fixed;
  bottom:30px;
  right:30px;
  background:var(--gold);
  color:var(--navy);
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:24px;
  transition:all .2s;
  opacity:0;
  visibility:hidden;
}
.back-top.show {
  opacity:1;
  visibility:visible;
}
.back-top:hover {
  background:var(--gold-light);
  transform:scale(1.1);
}
@media(max-width:900px) {
  .cata-header { padding:12px 20px; }
  .cata-grid { grid-template-columns:1fr 1fr; gap:16px; padding:0 20px 40px; }
  .cata-title h1 { font-size:36px; }
  .cata-filter { gap:8px; }
  .filter-btn { padding:6px 14px; font-size:12px; }
}
@media(max-width:640px) {
  .cata-grid { grid-template-columns:1fr; gap:20px; }
  .cata-img { padding:20px; }
  body { padding-top: 70px; }
  .cata-filter { gap:6px; }
  .filter-btn { padding:5px 12px; font-size:11px; }
}
.cata-footer {
  text-align:center;
  padding:30px;
  border-top:1px solid rgba(255,255,255,0.05);
  color:var(--gray);
  font-size:12px;
}
</style>
</head>
<body>

<header class="cata-header">
  <a href="index.html" class="cata-logo">EMP<span>PARTS</span></a>
  <a href="index.html" class="back-home">← Back to Home</a>
</header>

<div class="cata-title">
  <h1>📚 FULL CATALOGUE</h1>
  <p>Complete product range · Engineering Machinery Parts</p>
</div>

<!-- 分类筛选栏 -->
<div class="cata-filter" id="filterBar">
  <button class="filter-btn active" data-cat="all">All Products</button>
</div>

<div class="cata-grid" id="catalogueGrid">
  <div class="loading">Loading products...</div>
</div>

<footer class="cata-footer">
  <p>© 2025 EMP Parts Co., Ltd. · All specifications subject to change without notice.</p>
  <p style="margin-top:8px;">For inquiries: <a href="mailto:lina@empparts.com" style="color:var(--gold);">lina@empparts.com</a> | WhatsApp: +86 155 0242 1365</p>
</footer>

<a href="#" class="back-top" id="backTop">↑</a>

<script>
// CDN 加速前缀
const CDN_BASE = 'https://cdn.jsdelivr.net/gh/pro-excavator/empparts-site/';
const CONFIG_URL = 'site-config.json';

let allProducts = [];
let currentFilter = 'all';

function getImageUrl(path) {
  if (!path) return '';
  if (path.startsWith('http')) return path;
  return CDN_BASE + path;
}

async function loadCatalogue() {
  const grid = document.getElementById('catalogueGrid');
  const filterBar = document.getElementById('filterBar');
  
  try {
    const res = await fetch(CONFIG_URL + '?t=' + Date.now(), {
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache' }
    });
    if (!res.ok) throw new Error('加载失败');
    const data = await res.json();
    
    // 优先使用 catalogue.products，如果没有则使用 products
    allProducts = (data.catalogue && data.catalogue.products && data.catalogue.products.length) 
      ? data.catalogue.products 
      : (data.products || []);
    
    // 收集所有分类
    const categories = new Set();
    allProducts.forEach(p => { if (p.cat && p.cat.trim()) categories.add(p.cat); });
    
    // 渲染分类按钮
    filterBar.innerHTML = '<button class="filter-btn active" data-cat="all">All Products</button>';
    Array.from(categories).sort().forEach(cat => {
      filterBar.innerHTML += `<button class="filter-btn" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`;
    });
    
    // 绑定筛选事件
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.cat;
        renderProducts();
      });
    });
    
    renderProducts();
    
  } catch(e) {
    console.error('加载失败:', e);
    grid.innerHTML = '<div class="loading">❌ 加载失败，请刷新重试</div>';
  }
}

function renderProducts() {
  const grid = document.getElementById('catalogueGrid');
  let filtered = currentFilter === 'all' 
    ? allProducts 
    : allProducts.filter(p => p.cat === currentFilter);
  
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="loading">暂无产品数据</div>';
    return;
  }
  
  grid.innerHTML = filtered.map(function(p, i) {
    return `
      <div class="cata-item">
        <img class="cata-img" src="${getImageUrl(p.img || '')}" alt="${escapeHtml(p.name || '')}" loading="lazy">
        <div class="cata-info">
          <div class="cata-cat">${escapeHtml(p.cat || 'Product')}</div>
          <div class="cata-name">${escapeHtml(p.name || '')}</div>
          <div class="cata-brands">${escapeHtml(p.brands || '')}</div>
          ${p.partNo ? `<div class="cata-partno">Part No: ${escapeHtml(p.partNo)}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
    return c;
  });
}

// 返回顶部按钮
window.addEventListener('scroll', function() {
  const btn = document.getElementById('backTop');
  if (window.scrollY > 300) {
    btn.classList.add('show');
  } else {
    btn.classList.remove('show');
  }
});

loadCatalogue();
</script>
</body>
</html>
