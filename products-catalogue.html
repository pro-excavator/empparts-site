<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products Catalogue | EMP PARTS CO., LTD.</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0D1F35; --dark:#060E1A; --gold:#E8A020; --blue:#2176C8;
  --white:#fff; --gray:#7a8fa8; --border:rgba(255,255,255,0.08);
  --surface:#1a2332;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { overflow-x:hidden; }
body { font-family:'Barlow',sans-serif; background:var(--dark); color:var(--white); min-height:100vh; }

/* NAV */
nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 48px; height:72px;
  background:rgba(6,14,26,0.97); backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(232,160,32,0.2);
}
.nav-logo { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:22px; letter-spacing:2px; color:var(--white); text-decoration:none; display:flex; align-items:center; }
.nav-logo span { color:var(--gold); }
#navLogoImg { height:36px; width:auto; display:none; max-width:180px; object-fit:contain; }
.nav-back { display:flex; align-items:center; gap:8px; color:rgba(255,255,255,0.6); font-size:13px; font-weight:600; letter-spacing:1px; text-transform:uppercase; text-decoration:none; transition:color .2s; }
.nav-back:hover { color:var(--gold); }
.nav-back::before { content:'←'; font-size:16px; }

/* LAYOUT */
.page-wrap { padding-top:72px; display:flex; min-height:100vh; }

/* SIDEBAR */
.sidebar {
  width:260px; flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  position:sticky; top:72px; height:calc(100vh - 72px);
  overflow-y:auto; padding:24px 0;
}
.sidebar-title {
  font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase; color:var(--gray);
  padding:0 20px 12px; border-bottom:1px solid var(--border); margin-bottom:8px;
}
.cat-item {
  display:flex; align-items:center; gap:10px;
  padding:11px 20px; cursor:pointer; transition:all .15s;
  border-left:3px solid transparent; font-size:14px; font-weight:500; color:var(--gray);
  user-select:none;
}
.cat-item:hover { background:rgba(255,255,255,0.04); color:var(--white); }
.cat-item.active { background:rgba(232,160,32,0.1); color:var(--gold); border-left-color:var(--gold); }
.cat-item .cat-count { margin-left:auto; font-size:11px; background:rgba(255,255,255,0.08); padding:2px 7px; border-radius:10px; }
.cat-item.active .cat-count { background:rgba(232,160,32,0.2); color:var(--gold); }

/* MAIN CONTENT */
.main-content { flex:1; padding:32px 40px; min-width:0; }

/* BREADCRUMB */
.breadcrumb { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--gray); margin-bottom:24px; }
.breadcrumb a { color:var(--gray); text-decoration:none; }
.breadcrumb a:hover { color:var(--gold); }
.breadcrumb span { color:var(--white); font-weight:600; }
.breadcrumb-sep { color:rgba(255,255,255,0.2); }

/* SECTION HEADER */
.section-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border);
}
.section-header h2 {
  font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:800;
  text-transform:uppercase; display:flex; align-items:center; gap:12px;
}
.section-header h2::before { content:''; width:4px; height:28px; background:var(--gold); border-radius:2px; }
.product-count { font-size:12px; color:var(--gray); }

/* PRODUCT GRID */
.product-grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
}
@media(max-width:1200px) { .product-grid { grid-template-columns:repeat(3,1fr); } }
@media(max-width:900px) { .product-grid { grid-template-columns:repeat(2,1fr); } }

.product-card {
  background:var(--surface); border:1px solid var(--border); border-radius:4px;
  overflow:hidden; cursor:pointer; transition:all .2s;
}
.product-card:hover { border-color:rgba(232,160,32,0.4); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
.product-card-img {
  width:100%; aspect-ratio:1/1; object-fit:cover; display:block;
  background:var(--dark);
}
.product-card-info { padding:10px 12px; }
.product-card-name { font-size:12px; font-weight:600; color:var(--white); margin-bottom:3px; line-height:1.3; }
.product-card-sub { font-size:11px; color:var(--gray); }

/* LIGHTBOX */
.lightbox {
  position:fixed; inset:0; z-index:999;
  background:rgba(0,0,0,0.92); display:none;
  align-items:center; justify-content:center; padding:20px;
}
.lightbox.open { display:flex; }
.lightbox-img { max-width:80vw; max-height:80vh; object-fit:contain; border-radius:4px; }
.lightbox-close {
  position:absolute; top:20px; right:24px;
  color:#fff; font-size:32px; cursor:pointer; line-height:1;
  opacity:0.7; transition:opacity .2s;
}
.lightbox-close:hover { opacity:1; }
.lightbox-caption { position:absolute; bottom:24px; left:0; right:0; text-align:center; color:rgba(255,255,255,0.7); font-size:14px; }

/* SEARCH */
.search-bar { display:flex; gap:10px; margin-bottom:24px; }
.search-input {
  flex:1; background:var(--surface); border:1px solid var(--border);
  color:var(--white); font-family:'Barlow',sans-serif; font-size:14px;
  padding:10px 16px; border-radius:2px; outline:none; transition:border-color .2s;
}
.search-input:focus { border-color:var(--gold); }
.search-input::placeholder { color:var(--gray); }

/* EMPTY */
.empty-state { padding:60px 20px; text-align:center; color:var(--gray); }
.empty-state .icon { font-size:48px; margin-bottom:16px; }

/* MOBILE */
@media(max-width:768px) {
  nav { padding:0 16px; }
  .sidebar { position:fixed; left:-260px; top:72px; height:calc(100vh - 72px); z-index:50; transition:left .3s; }
  .sidebar.open { left:0; box-shadow:4px 0 20px rgba(0,0,0,0.5); }
  .main-content { padding:20px 16px; }
  .page-wrap { flex-direction:column; }
  .mobile-cat-btn { display:flex !important; }
}
.mobile-cat-btn {
  display:none; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--border);
  color:var(--white); padding:8px 16px; font-size:13px; font-weight:600;
  cursor:pointer; border-radius:2px; margin-bottom:16px; width:100%;
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo" id="navLogo">
    <img id="navLogoImg" src="" alt="EMP PARTS" style="height:36px;width:auto;display:none;max-width:180px;object-fit:contain;">
    <span id="navLogoText">EMP<span style="color:var(--gold)">PARTS</span></span>
  </a>
  <a href="index.html" class="nav-back">Back to Home</a>
</nav>

<div class="page-wrap">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Products Overview</div>
    <div id="catList"></div>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <button class="mobile-cat-btn" onclick="toggleSidebar()">☰ Categories</button>
    <div class="search-bar">
      <input class="search-input" id="searchInput" type="text" placeholder="Search products by name or part number..." oninput="handleSearch()">
    </div>
    <div class="breadcrumb" id="breadcrumb">
      <a href="#" onclick="showAll();return false;">All Products</a>
    </div>
    <div class="section-header">
      <h2 id="sectionTitle">All Products</h2>
      <span class="product-count" id="productCount"></span>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
const CONFIG_URL = 'site-config.json';
let allProducts = [];
let catalogue = { categories:[], products:[] };
let currentCat = null;
let searchQuery = '';

// Load config
async function init() {
  try {
    const res = await fetch(CONFIG_URL + '?t=' + Date.now());
    const cfg = await res.json();
    // Apply logo
    if (cfg.texts && cfg.texts.logoImg) {
      document.getElementById('navLogoImg').src = cfg.texts.logoImg;
      document.getElementById('navLogoImg').style.display = 'block';
      document.getElementById('navLogoText').style.display = 'none';
    }
    // Load catalogue data
    catalogue = cfg.catalogue || { categories:[], products:[] };
    // Fallback: use products from main config if no catalogue
    if (!catalogue.products || !catalogue.products.length) {
      // Build from main products
      catalogue.products = (cfg.products||[]).map((p,i) => ({
        id: i, name:p.name, cat:p.cat||'General',
        img:p.img, brands:p.brands, partNo:''
      }));
      // Extract unique categories
      const cats = [...new Set(catalogue.products.map(p=>p.cat).filter(Boolean))];
      catalogue.categories = cats.map(c => ({ name:c, id:c }));
    }
    renderCats();
    renderProducts(catalogue.products);
  } catch(e) {
    console.error('Failed to load config:', e);
    renderProducts([]);
  }
}

function renderCats() {
  const list = document.getElementById('catList');
  const counts = {};
  catalogue.products.forEach(p => { counts[p.cat] = (counts[p.cat]||0)+1; });
  const total = catalogue.products.length;

  list.innerHTML = `<div class="cat-item active" onclick="showAll()" id="catAll">
    <span>All Products</span>
    <span class="cat-count">${total}</span>
  </div>` +
  (catalogue.categories||[]).map(c => `
    <div class="cat-item" onclick="filterCat('${c.id||c.name}')" id="cat-${(c.id||c.name).replace(/\s/g,'_')}">
      <span>${c.name}</span>
      <span class="cat-count">${counts[c.name]||0}</span>
    </div>`).join('');
}

function showAll() {
  currentCat = null;
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('breadcrumb').innerHTML = '<span>All Products</span>';
  document.getElementById('sectionTitle').textContent = 'All Products';
  document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
  document.getElementById('catAll')?.classList.add('active');
  renderProducts(catalogue.products);
}

function filterCat(catId) {
  currentCat = catId;
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  const cat = catalogue.categories.find(c=>(c.id||c.name)===catId);
  const name = cat ? cat.name : catId;
  document.getElementById('breadcrumb').innerHTML =
    `<a href="#" onclick="showAll();return false;">All Products</a>
     <span class="breadcrumb-sep">›</span>
     <span>${name}</span>`;
  document.getElementById('sectionTitle').textContent = name;
  document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
  document.getElementById('cat-'+catId.replace(/\s/g,'_'))?.classList.add('active');
  const filtered = catalogue.products.filter(p => (p.cat===name||p.catId===catId));
  renderProducts(filtered);
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
}

function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!searchQuery) { currentCat ? filterCat(currentCat) : showAll(); return; }
  const filtered = catalogue.products.filter(p =>
    (p.name||'').toLowerCase().includes(searchQuery) ||
    (p.partNo||'').toLowerCase().includes(searchQuery) ||
    (p.brands||'').toLowerCase().includes(searchQuery)
  );
  document.getElementById('sectionTitle').textContent = `Search: "${searchQuery}"`;
  renderProducts(filtered);
}

function renderProducts(items) {
  const grid = document.getElementById('productGrid');
  document.getElementById('productCount').textContent = items.length + ' items';
  if (!items.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">📦</div><div>No products found</div></div>';
    return;
  }
  grid.innerHTML = items.map((p,i) => `
    <div class="product-card" onclick="openLightbox('${p.img||''}','${(p.name||'').replace(/'/g,"\\'")}','${p.partNo||''}')">
      <img class="product-card-img" src="${p.img||''}" alt="${p.name||''}"
        onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%231a2332%22 width=%22200%22 height=%22200%22/><text fill=%22%23444%22 font-size=%2240%22 x=%2250%%25%22 y=%2250%%25%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>📦</text></svg>'">
      <div class="product-card-info">
        <div class="product-card-name">${p.name||'Product'}</div>
        ${p.partNo ? `<div class="product-card-sub">${p.partNo}</div>` : ''}
        ${p.brands && !p.partNo ? `<div class="product-card-sub">${(p.brands||'').substring(0,40)}</div>` : ''}
      </div>
    </div>`).join('');
}

function openLightbox(src, name, partNo) {
  if (!src) return;
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxCaption').textContent = name + (partNo ? ' · ' + partNo : '');
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); });

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

init();
</script>
</body>
</html>
